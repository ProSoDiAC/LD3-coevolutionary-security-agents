services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coevsec
      POSTGRES_PASSWORD: ${COEVSEC_PG_PASSWORD:?set COEVSEC_PG_PASSWORD}
      POSTGRES_DB: coevsec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coevsec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
