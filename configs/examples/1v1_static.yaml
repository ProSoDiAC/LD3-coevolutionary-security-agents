# Example: one static (L0) heuristic attacker vs one static defender.
name: example_1v1_static
description: Static attacker vs static defender, no communication.
seed: 1
episodes: 30
max_turns: 20

environment:
  backend: sim
  hosts: 3
  vulnerabilities_per_host: 2
  detection_base_rate: 0.15

interaction:
  topology: none
  communication: none
  allow_coalitions: false

agents:
  - id_prefix: attacker
    role: attacker
    count: 1
    adaptation: static
    policy: { kind: heuristic, stealth: 0.3 }
    encoded_behaviours: [reconnaissance, privilege_escalation, resource_targeting]
  - id_prefix: defender
    role: defender
    count: 1
    adaptation: static
    policy: { kind: heuristic, stealth: 0.4 }
    encoded_behaviours: [adaptive_monitoring, dynamic_isolation]
